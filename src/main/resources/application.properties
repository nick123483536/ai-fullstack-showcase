spring.application.name=jobIntelligence
spring.datasource.url=jdbc:postgresql://localhost:5432/job_intelligence
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.data.redis.host=localhost
spring.data.redis.port=6379
server.port=8081
# Adzuna (free key from https://developer.adzuna.com). Leave unset to switch the source off.
adzuna.app-id=${ADZUNA_APP_ID:}
adzuna.app-key=${ADZUNA_APP_KEY:}
adzuna.country=in
adzuna.what=${ADZUNA_WHAT:software developer}
security.jwt.secret=${JWT_SECRET}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
